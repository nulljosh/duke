name: SurfStatus
options:
  bundleIdPrefix: com.nulljosh
targets:
  SurfStatus-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes: ["Info-iOS.plist", "Info-watchOS.plist"]
      - path: ../Surf.icon
      - path: ../fonts
        includes: ["*.ttf"]
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: false
        ATSApplicationFontsPath: "."
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Surf autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Surf
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status
        MARKETING_VERSION: "1.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Surf
  SurfStatus-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App
        excludes: ["Info-macOS.plist", "Info-iOS.plist"]
      - path: ../Surf.icon
    info:
      path: App/Info-watchOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Surf autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_NAME: Surf
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status.watch
        MARKETING_VERSION: "1.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Surf
  SurfStatus-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes: ["Info-macOS.plist", "Info-watchOS.plist"]
      - path: ../Surf.icon
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Surf autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: Surf
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status
        MARKETING_VERSION: "1.1"
        ASSETCATALOG_COMPILER_APPICON_NAME: Surf
    dependencies:
      - target: SurfWidget-iOS
        embed: true
  # The widget is its own process, so it reuses the app's sources rather than
  # keeping a second copy of the model. SurfStatusApp.swift is excluded —
  # two @main attributes in one module do not compile.
  SurfWidget-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "SurfStatusApp.swift"
          - "Info-macOS.plist"
          - "Info-iOS.plist"
          - "Info-watchOS.plist"
      - path: Widget
    info:
      path: Widget/Info-Widget.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Surf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: SurfWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status.widget
        MARKETING_VERSION: "1.1"
