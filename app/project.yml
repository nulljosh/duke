name: CruiseStatus
options:
  bundleIdPrefix: com.nulljosh
targets:
  CruiseStatus-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes: ["Info-iOS.plist", "Info-watchOS.plist"]
    info:
      path: App/Info-macOS.plist
      properties:
        LSUIElement: false
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Cruise autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Cruise
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CruiseStatus-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App
        excludes: ["Info-macOS.plist", "Info-iOS.plist"]
    info:
      path: App/Info-watchOS.plist
      properties:
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Cruise autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_NAME: Cruise
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status.watch
        MARKETING_VERSION: "1.0"
  CruiseStatus-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes: ["Info-macOS.plist", "Info-watchOS.plist"]
    info:
      path: App/Info-iOS.plist
      properties:
        NSLocalNetworkUsageDescription: Reads live puzzle progress from the Cruise autopilot running on your Mac.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: Cruise
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CruiseWidget-iOS
        embed: true
  # The widget is its own process, so it reuses the app's sources rather than
  # keeping a second copy of the model. CruiseStatusApp.swift is excluded —
  # two @main attributes in one module do not compile.
  CruiseWidget-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "CruiseStatusApp.swift"
          - "Info-macOS.plist"
          - "Info-iOS.plist"
          - "Info-watchOS.plist"
      - path: Widget
    info:
      path: Widget/Info-Widget.plist
      properties:
        CFBundleDisplayName: Cruise
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CruiseWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.cruise-status.widget
        MARKETING_VERSION: "1.0"
