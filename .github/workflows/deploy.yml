name: Deploy landing page

on:
  push:
    branches: [main]
    paths: [web/**, functions/**, brand/**, fonts/**, wrangler.toml]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy.sh --copy-only
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No directory argument: wrangler.toml's pages_build_output_dir points
          # at web/, which is also what makes root-level functions/ compile.
          command: pages deploy --project-name=pwnlingo --commit-dirty=true
