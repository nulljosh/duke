org.gradle.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
# Homebrew's JDK isn't on Compose's packaging-vendor allowlist. CI uses Temurin
# (via actions/setup-java) so this only matters for local `packageDmg` testing
# on this Mac — https://github.com/JetBrains/compose-multiplatform/issues/3107
compose.desktop.packaging.checkJdkVendor=false
